name: build

on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:

jobs:
      - name: Install system dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30 || true
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig-dev libfreetype6-dev libssl-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig-dev libfreetype6-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
          bash -n phonecam

      - name: Package
        run: |
          mkdir -p dist/phonecam
          cp target/release/phonecam-gui phonecam README.md dist/phonecam/
          tar -czf dist/phonecam-linux-x86_64.tar.gz -C dist phonecam
          sha256sum dist/phonecam-linux-x86_64.tar.gz > dist/phonecam-linux-x86_64.tar.gz.sha256
          ./phonecam && true

      - uses: actions/upload-artifact@v4
        with:
          name: phonecam-linux-x86_64
          path: dist/phonecam-linux-x86_64.tar.gz*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/phonecam-linux-x86_64.tar.gz
            dist/phonecam-linux-x86_64.tar.gz.sha256
